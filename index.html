    <script>
      window.global = window.global || window;
      window.process = window.process || { env: { NODE_ENV: 'production' } };
      (function() {
        // 1. Guard against any residual corrupted Firestore IndexedDB segment error
        function purgeCorruptedFirestoreIndexedDB(forceAllFirestore) {
          try {
            if (typeof indexedDB !== 'undefined' && typeof indexedDB.databases === 'function') {
              indexedDB.databases().then(function(dbs) {
                (dbs || []).forEach(function(dbInfo) {
                  var name = (dbInfo && dbInfo.name) ? String(dbInfo.name) : '';
                  if (!name) return;
                  var isCorruptedFirestore =
                    name.indexOf('firebase.io') !== -1 ||
                    name.indexOf('http:') !== -1 ||
                    name.indexOf('https:') !== -1 ||
                    name.indexOf('//') !== -1 ||
                    (forceAllFirestore && name.indexOf('firestore/') === 0);
                  if (isCorruptedFirestore) {
                    try { indexedDB.deleteDatabase(name); } catch (e) {}
                  }
                });
              }).catch(function() {});
            }
          } catch (e) {}
        }

        // One-time cleanup of legacy Firestore IndexedDB cache that stored the invalid URL databaseId
        try {
          var migrationKey = 'ssm_clean_firestore_idb_v4';
          if (!localStorage.getItem(migrationKey)) {
            localStorage.setItem(migrationKey, String(Date.now()));
            purgeCorruptedFirestoreIndexedDB(true);
          } else {
            purgeCorruptedFirestoreIndexedDB(false);
          }

          // Sanitize any localStorage config entries that accidentally stored firebase.io.com as databaseId
          for (var i = 0; i < localStorage.length; i++) {
            var k = localStorage.key(i);
            if (!k) continue;
            var v = localStorage.getItem(k);
            if (v && (v.indexOf('firebase.io.com') !== -1 || v.indexOf('sync_health') !== -1)) {
              if (k.indexOf('outbox') !== -1 || k.indexOf('PENDING_SYNC') !== -1) {
                localStorage.removeItem(k);
              } else {
                localStorage.setItem(
                  k,
                  v.replace(/https?:\/\/[a-zA-Z0-9.-]+\.firebase\.io\.com\/?/g, '(default)')
                );
              }
            }
          }
        } catch (e) {}

        window.addEventListener('error', function(event) {
          var msg = String((event && event.message) || (event && event.error && event.error.message) || '');
          if (msg.indexOf('Invalid segment') !== -1 || msg.indexOf('Paths must not contain //') !== -1) {
            event.preventDefault();
            purgeCorruptedFirestoreIndexedDB(true);
          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = String((reason && reason.message) || reason || '');
          if (msg.indexOf('Invalid segment') !== -1 || msg.indexOf('Paths must not contain //') !== -1) {
            event.preventDefault();
            purgeCorruptedFirestoreIndexedDB(true);
          }
        }, true);

        // 2. Clear legacy service worker caches to prevent serving stale bundles
        if ('serviceWorker' in navigator) {
          navigator.serviceWorker.getRegistrations().then(function(registrations) {
            for (var i = 0; i < registrations.length; i++) {
              registrations[i].unregister();
            }
          });
        }
        if ('caches' in window) {
          caches.keys().then(function(keys) {
            keys.forEach(function(key) {
              caches.delete(key);
            });
          });
        }
      })();
    </script>
